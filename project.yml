name: Task-Flow
options:
  bundleIdPrefix: com.eduardotorres
  deploymentTarget:
    iOS: "27.0"
  defaultConfig: Debug
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    # Free Personal Team. Automatic signing provisions both bundle IDs and the
    # App Group with -allowProvisioningUpdates; no portal access needed.
    # Caveat of a free team: the build expires after 7 days and must be reinstalled.
    DEVELOPMENT_TEAM: "TKWXX2M2X3"

targets:
  Task-Flow:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: App
      - path: Models
      - path: ViewModels
      - path: Views
      - path: Services
      - path: Extensions
      - path: Shared
      - path: Resources
      # App Store required privacy manifest. Bundled at the app root by the
      # build system regardless of group placement.
      - path: PrivacyInfo.xcprivacy
    info:
      path: Task-Flow/Info.plist
      properties:
        UILaunchScreen: {}
        NSCalendarsFullAccessUsageDescription: "Task Flow syncs your tasks with Calendar so you can see them alongside your events."
        NSRemindersFullAccessUsageDescription: "Task Flow syncs your tasks with Reminders so you can manage them in one place."
        NSMicrophoneUsageDescription: "Task Flow uses your microphone to capture voice-dictated tasks. Audio is transcribed on this device and is never uploaded."
        # The system's own first paragraph on this alert says speech data is sent
        # to Apple. That is the generic Speech-framework wording and it does not
        # apply here: transcription runs through SpeechAnalyzer against a model
        # installed on the device, with no server path. This string is the only
        # part of the alert the app controls, so it says so explicitly.
        NSSpeechRecognitionUsageDescription: "Task Flow transcribes your voice entirely on this device using Apple's on-device speech model. Your audio is never sent to a server."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.eduardotorres.Task-Flow.deeplink
            CFBundleURLSchemes:
              - taskflow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eduardotorres.Task-Flow
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_ENTITLEMENTS: App/TaskFlow.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: TaskFlowWidgetExtension
        embed: true

  TaskFlowWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Widget
      - path: Models
      - path: Extensions
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Task Flow
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eduardotorres.Task-Flow.TaskFlowWidget
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_ENTITLEMENTS: Widget/TaskFlowWidget.entitlements
